!
!
!
!
!
!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SpaceBody-R3
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
no ip dhcp use vrf connected
no ip dhcp conflict logging
!
ip dhcp pool 1
   network 10.2.1.0 255.255.255.0
   domain-name mars
   default-router 10.2.1.1 
!
!
ipv6 unicast-routing
ipv6 cef
ipv6 dhcp pool 1
 dns-server 2001:DB8:2:1::8888
 domain-name mars
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
interface Tunnel0
 ip address 192.168.9.2 255.255.255.0
 tunnel source FastEthernet0/0
 tunnel destination 2001:DB8:1:1::1
 tunnel mode ipv6
!
interface Tunnel1
 ip address 192.168.11.1 255.255.255.0
 tunnel source FastEthernet0/0
 tunnel destination 2001:DB8:2:2::1
 tunnel mode ipv6
!
interface FastEthernet0/0
 ip address 10.2.1.1 255.255.255.0
 duplex auto
 speed auto
 ipv6 address 2001:DB8:2:1::1/64
 ipv6 address FE80::1 link-local
 ipv6 nd other-config-flag
 ipv6 dhcp server 1
!
interface FastEthernet1/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:2:0:1::2/126
 ipv6 address FE80::2 link-local
!
interface FastEthernet2/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:2:0:3::2/126
 ipv6 address FE80::2 link-local
!
!
no ip http server
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 Tunnel0 192.168.9.1
ip route 10.2.2.0 255.255.255.0 Tunnel1 192.168.11.2
!
!
!
no cdp log mismatch duplex
ipv6 route 2001:DB8:2:2::/64 2001:DB8:2:0:3::1
ipv6 route ::/0 2001:DB8:2:0:1::1
ipv6 neighbor 2001:DB8:2:0:3::1 FastEthernet2/0 cc03.475f.0020
ipv6 neighbor 2001:DB8:2:0:1::1 FastEthernet1/0 cc02.1514.0010
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
