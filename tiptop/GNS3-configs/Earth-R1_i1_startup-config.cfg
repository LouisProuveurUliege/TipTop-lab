!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Earth-R1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
no ip dhcp conflict logging
!
!
ipv6 unicast-routing
ipv6 cef
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
interface Tunnel0
 ip address 192.168.9.1 255.255.255.0
 tunnel source FastEthernet0/0
 tunnel destination 2001:DB8:2:1::1
 tunnel mode ipv6
!
interface Tunnel1
 ip address 192.168.10.1 255.255.255.0
 tunnel source FastEthernet0/0
 tunnel destination 2001:DB8:2:2::1
 tunnel mode ipv6
!
interface FastEthernet0/0
 ip address 10.1.0.1 255.255.255.0
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:1::1/64
!
interface FastEthernet1/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:1::1/126
!
interface FastEthernet2/0
 ip address 10.0.0.2 255.255.255.0
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1234::2/64
!
!
no ip http server
ip forward-protocol nd
ip route 0.0.0.0 0.0.0.0 10.0.0.1
ip route 10.2.1.0 255.255.255.0 Tunnel0 192.168.9.2
ip route 10.2.2.0 255.255.255.0 Tunnel1 192.168.10.2
!
!
!
no cdp log mismatch duplex
ipv6 route 2001:DB8:2::/48 2001:DB8:1:0:1::2
ipv6 route ::/0 FastEthernet2/0 2001:DB8:1234::1
ipv6 neighbor 2001:DB8:1234::1 FastEthernet2/0 0242.b83f.8d00
ipv6 neighbor 2001:DB8:1:0:1::2 FastEthernet1/0 cc09.2d93.0000
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
