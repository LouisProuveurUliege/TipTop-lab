!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Earth-Forwarder
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:1::2/126
!
interface FastEthernet1/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:2::1/126
!
interface FastEthernet2/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:3::1/126
!
interface FastEthernet3/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:4::1/126
!
!
no ip http server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
ipv6 route 2001:DB8:2::/48 2001:DB8:1:0:3::2
ipv6 route ::/0 2001:DB8:1:0:1::1
ipv6 neighbor 2001:DB8:1:0:1::1 FastEthernet0/0 cc01.14f6.0010
ipv6 neighbor 2001:DB8:1:0:2::2 FastEthernet1/0 cc06.299f.0000
ipv6 neighbor 2001:DB8:1:0:3::2 FastEthernet2/0 cc07.29bc.0000
ipv6 neighbor 2001:DB8:1:0:4::2 FastEthernet3/0 cc08.29d8.0000
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
