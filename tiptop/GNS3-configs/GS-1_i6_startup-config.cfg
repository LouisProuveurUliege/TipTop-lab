!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname GS-1
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:1:0:2::2/126
!
interface FastEthernet1/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8::1/112
!
!
no ip http server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
ipv6 route 2001:DB8:2::/48 2001:DB8::1001
ipv6 route ::/0 2001:DB8:1:0:2::1
ipv6 neighbor 2001:DB8::1001 FastEthernet1/0 cc02.1514.0000
ipv6 neighbor 2001:DB8:1:0:2::1 FastEthernet0/0 cc09.2d93.0010
ipv6 neighbor 2001:DB8::1002 FastEthernet1/0 cc03.475f.0000
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
