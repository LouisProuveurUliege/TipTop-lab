!
!
!
!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname SpaceBody-R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
!
!
ip cef
no ip domain lookup
!
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
interface FastEthernet0/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8::1002/112
 ipv6 address FE80::1002 link-local
!
interface FastEthernet1/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:2:0:4::1/126
 ipv6 address FE80::1 link-local
!
interface FastEthernet2/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:2:0:3::1/126
 ipv6 address FE80::1 link-local
!
interface FastEthernet3/0
 no ip address
 duplex auto
 speed auto
 ipv6 address 2001:DB8:0:3::2/126
 ipv6 address FE80::2 link-local
!
!
no ip http server
ip forward-protocol nd
!
!
!
no cdp log mismatch duplex
ipv6 route 2001:DB8:2:1::/64 2001:DB8:2:0:3::2
ipv6 route 2001:DB8:2:2::/64 2001:DB8:2:0:4::2
ipv6 route ::/0 2001:DB8::2
ipv6 neighbor 2001:DB8::1 FastEthernet0/0 cc06.299f.0010
ipv6 neighbor 2001:DB8:2:0:3::2 FastEthernet2/0 cc04.4e15.0020
ipv6 neighbor 2001:DB8::3 FastEthernet0/0 cc08.29d8.0010
ipv6 neighbor 2001:DB8:0:3::1 FastEthernet3/0 cc02.1514.0030
ipv6 neighbor 2001:DB8::2 FastEthernet0/0 cc07.29bc.0010
ipv6 neighbor 2001:DB8:2:0:4::2 FastEthernet1/0 cc05.4e5c.0010
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
