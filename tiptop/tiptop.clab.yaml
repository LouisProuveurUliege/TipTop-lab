name: tiptop

topology:
  groups:
    frr-router:
      kind: linux
      image: frrouting/frr:v8.4.0
      binds:
        - configs/__clabNodeName__/daemons:/etc/frr/daemons
        - configs/__clabNodeName__/frr.conf:/etc/frr/frr.conf
      exec:
        - ip route del default dev eth0
        - ip -6 route del default dev eth0

    service:
      exec:
        - ip route del default dev eth0
        - ip -6 route del default dev eth0

  nodes:

    # Routers ============================================

    Earth-R1:
      group: frr-router

    Earth-Gateway:
      group: frr-router

    # The following routers need ipv6 neighbor entries to avoid ND over deep space links

    GS1:
      group: frr-router
      exec:
        - ip -6 neigh add 2001:db8::1001 lladdr 02:00:00:00:05:04 dev eth1 nud permanent
        - ip -6 neigh add 2001:db8::1002 lladdr 02:00:00:00:06:04 dev eth1 nud permanent

    GS2:
      group: frr-router
      exec:
        - ip -6 neigh add 2001:db8::1001 lladdr 02:00:00:00:05:04 dev eth1 nud permanent
        - ip -6 neigh add 2001:db8::1002 lladdr 02:00:00:00:06:04 dev eth1 nud permanent

    GS3:
      group: frr-router
      exec:
        - ip -6 neigh add 2001:db8::1001 lladdr 02:00:00:00:05:04 dev eth1 nud permanent
        - ip -6 neigh add 2001:db8::1002 lladdr 02:00:00:00:06:04 dev eth1 nud permanent

    Orbiter1:
      group: frr-router
      exec:
        - ip -6 neigh add 2001:db8::1 lladdr 02:00:00:00:02:01 dev eth4 nud permanent
        - ip -6 neigh add 2001:db8::2 lladdr 02:00:00:00:03:01 dev eth4 nud permanent
        - ip -6 neigh add 2001:db8::3 lladdr 02:00:00:00:04:01 dev eth4 nud permanent

    Orbiter2:
      group: frr-router
      exec:
        - ip -6 neigh add 2001:db8::1 lladdr 02:00:00:00:02:01 dev eth4 nud permanent
        - ip -6 neigh add 2001:db8::2 lladdr 02:00:00:00:03:01 dev eth4 nud permanent
        - ip -6 neigh add 2001:db8::3 lladdr 02:00:00:00:04:01 dev eth4 nud permanent

    SpaceBody-R1:
      group: frr-router

    SpaceBody-R2:
      group: frr-router

    # Bridges =============================================

    # Bridge to connect earth services
    tiptop-br-earth:
      kind: bridge

    # Bridge to connect services on the space body (hub)
    tiptop-br-hub:
      kind: bridge

    # Bridge to connect services on the space body (rover)
    tiptop-br-rover:
      kind: bridge

    # Bridge to aggregate links in space
    tiptop-br-space:
      kind: bridge

    # Services ============================================

    dns-SB:
      kind: linux
      group: service
      image: louisprouveuruliege/tiptop-dns:latest
      binds:
        - configs/__clabNodeName__/Corefile:/Corefile
        - configs/__clabNodeName__/zones:/zones
      exec:
        - ip addr add 2001:db8:2:1::8888/64 dev eth1

    dns-earth:
      kind: linux
      group: service
      image: louisprouveuruliege/tiptop-dns:latest
      binds:
        - configs/__clabNodeName__/Corefile:/Corefile
        - configs/__clabNodeName__/zones:/zones
      exec:
        - ip addr add 2001:db8:1:1::8888/64 dev eth1

    h3-server-quiche:
      kind: linux
      group: service
      image: louisprouveuruliege/tiptop-h3-server:latest
      env:
        QLOGDIR: /qlog
      exec:
        - sh -c "echo 'nameserver 2001:db8:2:1::8888' > /etc/resolv.conf"
        - mkdir /qlog

    h3-client-quiche:
      kind: linux
      group: service
      image: louisprouveuruliege/tiptop-h3-client:latest
      env:
        QLOGDIR: /qlog
      exec:
        - sh -c "echo 'nameserver 2001:db8:1:1::8888' > /etc/resolv.conf"
        - mkdir /qlog

  links:

    # Earth links =========================================

    - endpoints: [ Earth-R1:eth2, Earth-Gateway:eth4 ]

    - endpoints: [ Earth-Gateway:eth1, GS1:eth2 ]
    - endpoints: [ Earth-Gateway:eth2, GS2:eth2 ]
    - endpoints: [ Earth-Gateway:eth3, GS3:eth2 ]

    # Deep Space links =====================================

    - type: veth
      endpoints:
        - node: "tiptop-br-space"
          interface: "GS1"
        - node: "GS1"
          interface: "eth1"
          mac: 02:00:00:00:02:01
    - type: veth
      endpoints:
        - node: "tiptop-br-space"
          interface: "GS2"
        - node: "GS2"
          interface: "eth1"
          mac: 02:00:00:00:03:01
    - type: veth
      endpoints:
        - node: "tiptop-br-space"
          interface: "GS3"
        - node: "GS3"
          interface: "eth1"
          mac: 02:00:00:00:04:01
    - type: veth
      endpoints:
        - node: "tiptop-br-space"
          interface: "O24"
        - node: "Orbiter2"
          interface: "eth4"
          mac: 02:00:00:00:06:04
    - type: veth
      endpoints:
        - node: "tiptop-br-space"
          interface: "O15"
        - node: "Orbiter1"
          interface: "eth4"
          mac: 02:00:00:00:05:04

    # Space Body links

    - endpoints: [ Orbiter1:eth1, SpaceBody-R1:eth1 ]
    - endpoints: [ Orbiter1:eth2, SpaceBody-R2:eth2 ]

    - endpoints: [ Orbiter2:eth1, SpaceBody-R2:eth1 ]
    - endpoints: [ Orbiter2:eth2, SpaceBody-R1:eth2 ]

    - endpoints: [ Orbiter1:eth3, Orbiter2:eth3 ]

    # Services Links ==========================================

    - endpoints: [ Earth-R1:eth1, tiptop-br-earth:eR1 ]
    - endpoints: [ SpaceBody-R1:eth3, tiptop-br-hub:sbR1 ]
    - endpoints: [ SpaceBody-R2:eth3, tiptop-br-rover:sbR2 ]
    - type: veth
      endpoints:
        - node: "h3-server-quiche"
          interface: "eth1"
          mac: aa:c1:ab:00:51:7b  # Fixed MAc address such that fixed IPv6 addr
        - node: "tiptop-br-hub"
          interface: "h3serv"
    - endpoints: [ dns-SB:eth1, tiptop-br-hub:sbDNS ]

    - endpoints: [ h3-client-quiche:eth1, tiptop-br-earth:h3client ]
    - endpoints: [ dns-earth:eth1, tiptop-br-earth:eDNS ]
